
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Product Showcase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <h2 class="text-center mb-4">Featured Products</h2>

    <div class="row g-3">

        <div class="col-6 col-md-3">
            <div class="card h-100">
                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400&h=300&fit=crop"
                     class="card-img-top" alt="Watch">
                <div class="card-body">
                    <h6 class="card-title">Smart Watch</h6>
                    <p class="fw-bold">₹1,999</p>
                    <a href="#" class="btn btn-primary btn-sm">Buy Now</a>
                </div>
            </div>
        </div>

        <div class="col-6 col-md-3">
            <div class="card h-100">
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400&h=300&fit=crop"
                     class="card-img-top" alt="Headphones">
                <div class="card-body">
                    <h6 class="card-title">Headphones</h6>
                    <p class="fw-bold">₹1,499</p>
                    <a href="#" class="btn btn-primary btn-sm">Buy Now</a>
                </div>
            </div>
        </div>

        <div class="col-6 col-md-3">
            <div class="card h-100">
                <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=400&h=300&fit=crop"
                     class="card-img-top" alt="Mobile">
                <div class="card-body">
                    <h6 class="card-title">Smartphone</h6>
                    <p class="fw-bold">₹14,999</p>
                    <a href="#" class="btn btn-primary btn-sm">Buy Now</a>
                </div>
            </div>
        </div>

        <div class="col-6 col-md-3">
            <div class="card h-100">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400&h=300&fit=crop"
                     class="card-img-top" alt="Shoes">
                <div class="card-body">
                    <h6 class="card-title">Sports Shoes</h6>
                    <p class="fw-bold">₹2,499</p>
                    <a href="#" class="btn btn-primary btn-sm">Buy Now</a>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
