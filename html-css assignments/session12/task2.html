
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Featured Playlists</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">

<div class="container py-5">
    <h2 class="text-center mb-4">Featured Playlists</h2>

    <div class="row g-4">

        <div class="col-md-4 col-12">
            <div class="card bg-secondary text-white h-100">
                <img src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=500&h=300&fit=crop"
                     class="card-img-top" alt="Party Playlist">
                <div class="card-body">
                    <h5 class="card-title">Party Hits</h5>
                    <p class="card-text">Enjoy energetic party songs.</p>
                    <a href="https://open.spotify.com/" class="btn btn-success">Listen Now</a>
                </div>
            </div>
        </div>

        <div class="col-md-4 col-12">
            <div class="card bg-secondary text-white h-100">
                <img src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=500&h=300&fit=crop"
                     class="card-img-top" alt="Relaxing Playlist">
                <div class="card-body">
                    <h5 class="card-title">Relaxing Music</h5>
                    <p class="card-text">Relax with your favourite music.</p>
                    <a href="https://open.spotify.com/" class="btn btn-success">Listen Now</a>
                </div>
            </div>
        </div>

        <div class="col-md-4 col-12">
            <div class="card bg-secondary text-white h-100">
                <img src="https://images.unsplash.com/photo-1511379938547-c1f69419868d?w=500&h=300&fit=crop"
                     class="card-img-top" alt="Acoustic Playlist">
                <div class="card-body">
                    <h5 class="card-title">Acoustic Vibes</h5>
                    <p class="card-text">Listen to beautiful acoustic songs.</p>
                    <a href="https://open.spotify.com/" class="btn btn-success">Listen Now</a>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
