
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Artist</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
        }

        .artist-img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 50%;
        }

        .social-btn {
            margin: 8px;
            border-radius: 25px;
        }
    </style>
</head>
<body>

<div class="container text-center py-5">
    <img src="https://images.unsplash.com/photo-1516280440614-37939bbacd81?w=300&h=300&fit=crop"
         alt="Music Artist" class="artist-img mb-4">

    <h1 class="fw-bold">urvashi Music</h1>
    <h5 class="text-success">Singer and Songwriter</h5>

    <p class="mt-3">
        I am a passionate music artist who loves creating
        songs and sharing music with the world.
    </p>

    <a href="https://www.instagram.com/" class="btn btn-danger social-btn">
        <i class="bi bi-instagram"></i> Instagram
    </a>

    <a href="https://www.youtube.com/" class="btn btn-light social-btn">
        <i class="bi bi-youtube"></i> YouTube
    </a>

    <a href="https://open.spotify.com/" class="btn btn-success social-btn">
        <i class="bi bi-spotify"></i> Spotify
    </a>
</div>

</body>
</html>
