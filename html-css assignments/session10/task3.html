
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookMyShow Movie Carousel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">
    <h2 class="text-center mb-4">Featured Movies</h2>

    <div id="movieCarousel" class="carousel slide"
         data-bs-ride="carousel">

        <div class="carousel-indicators">
            <button type="button" data-bs-target="#movieCarousel"
                data-bs-slide-to="0" class="active"
                aria-label="Movie 1"></button>
            <button type="button" data-bs-target="#movieCarousel"
                data-bs-slide-to="1"
                aria-label="Movie 2"></button>
            <button type="button" data-bs-target="#movieCarousel"
                data-bs-slide-to="2"
                aria-label="Movie 3"></button>
        </div>

        <div class="carousel-inner">

            <div class="carousel-item active">
        <img src="https://placehold.co/800x400/222222/ffffff?text=Saiyaara"
     class="d-block w-100" alt="Saiyaara">
                    
                <div class="carousel-caption">
                    <h5>Movie One</h5>
                    <p>Coming Soon</p>
                </div>
            </div>

            <div class="carousel-item">
                <img src="https://placehold.co/800x400/483D88/ffffff?text=Stree+2"
     class="d-block w-100" alt="Stree 2">
                <div class="carousel-caption">
                    <h5>Movie Two</h5>
                    <p>Now Showing</p>
                </div>
            </div>

            <div class="carousel-item">
                <img src="https://placehold.co/800x400/8B0000/ffffff?text=Chhaava"
     class="d-block w-100" alt="Chhaava">
                <div class="carousel-caption">
                    <h5>Movie Three</h5>
                    <p>Book Your Tickets</p>
                </div>
            </div>

        </div>

        <button class="carousel-control-prev" type="button"
            data-bs-target="#movieCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
            <span class="visually-hidden">Previous</span>
        </button>

        <button class="carousel-control-next" type="button"
            data-bs-target="#movieCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
            <span class="visually-hidden">Next</span>
        </button>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
