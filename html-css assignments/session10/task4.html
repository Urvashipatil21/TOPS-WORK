
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato Restaurant Review</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card mx-auto shadow p-4" style="max-width: 500px;">
        <h2 class="text-center text-danger mb-4">Restaurant Review</h2>

        <form>
            <div class="mb-3">
                <label for="name" class="form-label">Your Name</label>
                <input type="text" class="form-control"
                       id="name" placeholder="Enter your name" required>
            </div>

            <div class="mb-3">
                <label for="rating" class="form-label">Rating (1-5 Stars)</label>
                <select class="form-select" id="rating" required>
                    <option value="">Select Rating</option>
                    <option value="1">1 Star</option>
                    <option value="2">2 Stars</option>
                    <option value="3">3 Stars</option>
                    <option value="4">4 Stars</option>
                    <option value="5">5 Stars</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="review" class="form-label">Your Review</label>
                <textarea class="form-control" id="review"
                          rows="4" placeholder="Write your review"
                          required></textarea>
            </div>

            <button type="submit" class="btn btn-danger w-100">
                Submit Review
            </button>
        </form>
    </div>
</div>

</body>
</html>
