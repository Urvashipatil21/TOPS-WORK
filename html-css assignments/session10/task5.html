
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Filter Buttons</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5 text-center">
    <h2 class="mb-4">Food Delivery Filters</h2>

    <div class="btn-group flex-wrap" role="group"
         aria-label="Food filters">

        <button type="button" class="btn btn-success active"
                aria-pressed="true" onclick="selectFilter(this)">
            All
        </button>

        <button type="button" class="btn btn-outline-success"
                aria-pressed="false" onclick="selectFilter(this)">
            Veg
        </button>

        <button type="button" class="btn btn-outline-success"
                aria-pressed="false" onclick="selectFilter(this)">
            Non-Veg
        </button>

        <button type="button" class="btn btn-outline-success"
                aria-pressed="false" onclick="selectFilter(this)">
            Desserts
        </button>

    </div>

    <p class="mt-4" id="selectedFilter">Selected Filter: All</p>
</div>

<script>
    function selectFilter(button) {
        let buttons = document.querySelectorAll(".btn-group .btn");

        buttons.forEach(function(btn) {
            btn.classList.remove("active", "btn-success");
            btn.classList.add("btn-outline-success");
            btn.setAttribute("aria-pressed", "false");
        });

        button.classList.add("active", "btn-success");
        button.classList.remove("btn-outline-success");
        button.setAttribute("aria-pressed", "true");

        document.getElementById("selectedFilter").textContent =
            "Selected Filter: " + button.textContent.trim();
    }
</script>

</body>
</html>
