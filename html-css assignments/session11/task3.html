

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="text-center mb-4">Zomato Restaurant List</h2>

    <div class="card mb-3 p-3">
        <h4 class="text-dark">Pizza Palace</h4>
        <p class="text-success fw-bold">Rating: 4.5 ⭐</p>
        <p class="text-primary">Offer: 20% Off</p>
        <span class="text-success fw-bold">Open Now</span>
    </div>

    <div class="card mb-3 p-3">
        <h4 class="text-dark">Burger House</h4>
        <p class="text-success fw-bold">Rating: 4.2 ⭐</p>
        <p class="text-warning">Offer: Buy 1 Get 1</p>
        <span class="text-danger fw-bold">Closed</span>
    </div>

    <div class="card mb-3 p-3">
        <h4 class="text-dark">Sweet Corner</h4>
        <p class="text-success fw-bold">Rating: 4.7 ⭐</p>
        <p class="text-primary">Offer: 10% Off</p>
        <span class="text-success fw-bold">Open Now</span>
    </div>
</div>

</body>
</html>
