
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Switcher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div id="mainContainer" class="container bg-light text-dark p-5 mt-5 rounded">
    <h2>Welcome to My Website</h2>
    <p>Click the button to change the theme.</p>

    <button class="btn btn-primary" onclick="toggleTheme()">
        Switch Theme
    </button>
</div>

<script>
    function toggleTheme() {
        let container = document.getElementById("mainContainer");

        container.classList.toggle("bg-light");
        container.classList.toggle("bg-dark");

        container.classList.toggle("text-dark");
        container.classList.toggle("text-light");
    }
</script>

</body>
</html>
