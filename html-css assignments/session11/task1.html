
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Spacing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="text-center mb-4">Flipkart Products</h2>

    <div class="card m-2 p-2" style="width: 18rem;">
      
<img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=300&h=200&fit=crop"
     class="card-img-top" alt="Mobile">

        <div class="card-body m-2 p-3">
            <h5 class="card-title">Samsung Mobile</h5>
            <p class="card-text">Price: ₹15,000</p>
        </div>
    </div>
</div>

</body>
</html>
