
<!DOCTYPE html>
<html>
<head>
    <title>Zomato Restaurants</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">
    <h2 class="text-center">Zomato Restaurants</h2>

    <div class="row">
        <div class="col-6">
            <div class="card p-3 mb-3">
                <h5>Pizza Palace</h5>
                <p>Delicious pizza and Italian food.</p>
            </div>
        </div>

        <div class="col-6">
            <div class="card p-3 mb-3">
                <h5>Burger House</h5>
                <p>Tasty burgers and French fries.</p>
            </div>
        </div>

        <div class="col-6">
            <div class="card p-3 mb-3">
                <h5>Spice Garden</h5>
                <p>Enjoy delicious Indian food.</p>
            </div>
        </div>

        <div class="col-6">
            <div class="card p-3 mb-3">
                <h5>Food Corner</h5>
                <p>Fresh food and tasty snacks.</p>
            </div>
        </div>
    </div>
</div>

</body>
</html>
