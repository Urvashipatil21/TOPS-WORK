<body>
    <script>
const formatFollowers = (number) => {

  if(number >= 1000000) {
    return (number / 1000000) + "M";
  }
  else if(number >= 1000) {
    return (number / 1000).toFixed(1) + "K";
  }

  return number;
};

console.log(formatFollowers(1500));
console.log(formatFollowers(2000000));
</script>
</body>
</html>
