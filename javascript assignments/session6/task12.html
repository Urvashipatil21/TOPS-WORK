<!DOCTYPE html>
<html>
<head>
<title>Now Playing</title>
</head>

<body>

<h2>Now Playing: 
<span id="song-title">Kesariya</span>
</h2>

<button onclick="changeSong()">Change Song</button>


<script>

let songs = [
"Kesariya",
"Apna Bana Le",
"Perfect",
"Shape of You"
];

let index = 0;

function changeSong(){

index++;

if(index >= songs.length){
index = 0;
}

document.getElementById("song-title").innerHTML =
songs[index];

}

</script>

</body>
</html>
