<!DOCTYPE html>
<html lang="en">

<body>
    <script>
        function deletePlaylistLink(index){

    let playlists = JSON.parse(
        localStorage.getItem("myPlaylists")
    ) || [];


    playlists.splice(index,1);


    localStorage.setItem(
        "myPlaylists",
        JSON.stringify(playlists)
    );

}
    </script>
</body>
