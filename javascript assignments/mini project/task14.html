<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function checkInstagram(){

    let input = document.getElementById("instaUrl");

    let message = document.getElementById("message");


    if(input.value.includes("instagram.com")){

        message.innerHTML = "";

    }

    else{

        message.innerHTML = "Please enter a valid Instagram URL";

    }

}
    </script>
</body>
</html>
