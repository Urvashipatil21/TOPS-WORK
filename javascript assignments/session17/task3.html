<!DOCTYPE html>
<html>
<body>

<h2>Favorite Songs</h2>

<ul id="songList">
    <li>
        Tum Hi Ho
        <button>Remove</button>
    </li>

    <li>
        Kesariya
        <button>Remove</button>
    </li>

    <li>
        Apna Bana Le
        <button>Remove</button>

</ul>


<script>

const list = document.getElementById("songList");

list.addEventListener("click",function(e){

        e.target.parentElement.remove();
    }

});

</script>
