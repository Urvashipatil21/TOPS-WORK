<!DOCTYPE html>
<html>
<head>
    <title>Add Playlist</title>
</head>
<body>

<script>

function addNewPlaylist(){

fetch("https://jsonplaceholder.typicode.com/posts",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

name:"Road Trip",
description:"Best travel songs"

})

})

.then(response=>response.json())
.then(data=>{
console.log(data);
});

}

addNewPlaylist();

</script>

</body>
</html>
