<!DOCTYPE html>
<html>
<head>
    <title>Fetch Posts</title>
</head>
<body>

<script>
fetch("https://jsonplaceholder.typicode.com/posts")
.then(response => response.json())
.then(posts => {
    posts.slice(0, 5).forEach(post => {
        console.log(post.title);
    });
})
.catch(error => console.log(error));
</script>

</body>
</html>
