<!DOCTYPE html>
<html>
<head>
    <title>POST Request</title>
</head>
<body>

<script>

fetch("https://jsonplaceholder.typicode.com/posts",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
title:"My First Post",
body:"Learning Fetch API"
})

})

.then(response=>response.json())
.then(data=>{
console.log(data);

if(data.id){
console.log("ID is present:",data.id);
}
});

</script>

</body>
</html>
