<!DOCTYPE html>
<html>
<head>
  <title>Insta Bio</title>
</head>
<body>

  <button class="greet-btn">Show Greeting</button>

  <script>
    // select the button using querySelector
    const button = document.querySelector(".greet-btn");

    // add click event listener
    button.addEventListener("click", function() {
      alert("Hello from JS!");
    });
  </script>

</body>
</html>
